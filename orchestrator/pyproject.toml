[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-orchestrator"
version = "0.1.0"
description = "JANUS orchestrator: input layer (AEMO price forecasts + SoC) for EVerest"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "PyYAML==6.0.3",
    "python-dateutil==2.9.0.post0",
    "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
plot = ["matplotlib==3.11.2"]   # error_dist heatmap and experiment plots
milp = ["scipy==1.18.1"]        # E8 perfect-foresight MILP (HiGHS)

[tool.setuptools]
# this directory IS the `orchestrator` package
package-dir = { "orchestrator" = "." }
packages = ["orchestrator", "orchestrator.inputs", "orchestrator.decision", "orchestrator.live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
